<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Pocket Chat</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:sans-serif;height:100vh;overflow:hidden;background:#fff0f5;color:#5a524e;}
        #lock-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#ffd1dc,#fff0f5);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:80px 0 40px;transition:transform 0.5s ease;overflow-y:auto;}
        #lock-screen.unlocked{transform:translateY(-100%);}
        .lock-clock{font-size:80px;color:#fff;font-weight:200;}
        .unlock-hint{color:rgba(255,255,255,0.8);margin-top:20px;}
        .view{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;background:#fff;}
        .view.active{display:flex;}
        #home-view{align-items:center;padding-top:40px;background:linear-gradient(180deg,#fff0f5,#ffe4e1);overflow-y:auto;}
        .clock{font-size:56px;color:#ffb6c1;font-weight:300;}
        .location{font-size:13px;color:#d8a0a0;margin-top:5px;cursor:pointer;display:flex;align-items:center;gap:4px;}
        .location::before{content:"📍";}
        .user-avatar{width:90px;height:90px;border-radius:50%;border:3px solid #fff;margin:20px 0;object-fit:cover;cursor:pointer;}
        .user-name{font-size:20px;color:#8a6d6d;cursor:pointer;}
        .app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;width:90%;margin-top:40px;}
        .app-item{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#8a6d6d;}
        .app-icon{width:60px;height:60px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
        .nav-header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0;}
        .nav-title{font-size:17px;font-weight:bold;}
        .nav-back{font-size:18px;color:#5a524e;cursor:pointer;}
        .add-btn{font-size:22px;color:#ffb6c1;font-weight:bold;cursor:pointer;}
        .chat-list{flex:1;overflow-y:auto;padding:12px;padding-bottom:65px;-webkit-overflow-scrolling:touch;}
        .chat-item{display:flex;align-items:center;padding:14px;border-bottom:1px solid #f5f5f5;position:relative;}
        .chat-item:active{background:#f8f8f8;}
        .c-avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#f8f8f8;margin-right:12px;cursor:pointer;overflow:hidden;}
        .c-avatar img{width:100%;height:100%;object-fit:cover;}
        .chat-info{flex:1;}
        .chat-name{font-weight:bold;margin-bottom:2px;}
        .chat-desc{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75%;}
        .chat-time{font-size:11px;color:#ccc;position:absolute;top:14px;right:14px;}
        .message-area{flex:1;overflow-y:auto;padding:15px;padding-bottom:70px;display:flex;flex-direction:column;gap:12px;background:#fff9fb;-webkit-overflow-scrolling:touch;}
        .bubble{max-width:72%;padding:12px 15px;border-radius:18px;word-wrap:break-word;word-break:break-all;line-height:1.5;cursor:pointer;user-select:none;}
        .bubble-user{align-self:flex-end;background:#ffc0cb;border-bottom-right-radius:4px;}
        .bubble-ai{align-self:flex-start;background:#fff;border:1px solid #eee;border-bottom-left-radius:4px;}
        .input-bar{position:fixed;bottom:60px;left:0;width:100%;height:55px;background:#fff;display:flex;align-items:center;padding:0 15px;border-top:1px solid #eee;flex-shrink:0;}
        .input-bar input{flex:1;height:38px;border:none;background:#f7f2f4;border-radius:18px;padding:0 15px;outline:none;}
        .send-btn{margin-left:12px;color:#ffb6c1;font-weight:bold;cursor:pointer;}
        .tab-bar{position:fixed;bottom:0;left:0;width:100%;height:60px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;}
        .tab-item{display:flex;flex-direction:column;align-items:center;color:#aaa;font-size:12px;cursor:pointer;}
        .tab-item.active{color:#ffb6c1;}
        .tab-icon{font-size:22px;margin-bottom:2px;}
        #me-view{overflow-y:auto;}
        .me-top{padding:30px 20px;display:flex;align-items:center;background:#fff;}
        .me-avatar{width:72px;height:72px;border-radius:8px;margin-right:15px;object-fit:cover;background:#eee;cursor:pointer;}
        .me-name{font-size:18px;font-weight:bold;margin-bottom:4px;cursor:pointer;}
        .me-code{font-size:14px;color:#999;cursor:pointer;}
        .me-qr{font-size:22px;margin-left:auto;cursor:pointer;}
        .edit-mask{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;z-index:100;padding-top:60px;}
        .edit-box{width:90%;margin:0 auto;background:#f7f3f0;border-radius:20px;padding:20px;}
        .edit-box h4{margin-bottom:10px;}
        .edit-box textarea{width:100%;height:120px;border-radius:12px;border:none;padding:12px;outline:none;resize:none;margin:10px 0;}
        .btn-group{display:flex;gap:10px;}
        .btn{flex:1;height:42px;border-radius:20px;border:none;font-weight:bold;cursor:pointer;}
        .btn-cancel{background:#ddd;}
        .btn-save{background:#ffb6c1;color:#fff;}
        .qr-mask{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100;}
        .qr-mask.show{display:flex;}
        .qr-mask img{width:80%;border-radius:12px;}
        input[type="file"]{display:none;}
    </style>
</head>
<body>
<div id="lock-screen">
    <div class="lock-clock">00:00</div>
    <div class="unlock-hint">向上滑动解锁</div>
</div>

<section class="view active" id="home-view">
    <div class="clock" id="nowTime">00:00</div>
    <div class="location" id="locationTxt" onclick="editData('location','修改地点')">正在加载地点…</div>
    <img id="homeAvatar" class="user-avatar" onclick="upAvatar()">
    <div class="user-name" id="homeName" onclick="editData('homeName','修改昵称')">用户</div>
    <div class="app-grid">
        <div class="app-item" onclick="switchView('list-view')"><div class="app-icon">💬</div><span>Pocket</span></div>
        <div class="app-item"><div class="app-icon">🎵</div><span>音乐</span></div>
        <div class="app-item"><div class="app-icon">📝</div><span>笔记</span></div>
        <div class="app-item" onclick="switchView('api-view')"><div class="app-icon">⚙️</div><span>API</span></div>
    </div>
</section>

<section class="view" id="list-view">
    <div class="nav-header">
        <span class="nav-back" onclick="switchView('home-view')">&lt;</span>
        <span class="nav-title">Pocket Chat</span>
        <span class="add-btn" onclick="addRole()">+</span>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="tab-bar">
        <div class="tab-item active" onclick="changeTab('chat')"><span class="tab-icon">💬</span><span>聊天</span></div>
        <div class="tab-item" onclick="changeTab('moments')"><span class="tab-icon">🍥</span><span>朋友圈</span></div>
        <div class="tab-item" onclick="changeTab('me')"><span class="tab-icon">🫓</span><span>我</span></div>
    </div>
</section>

<section class="view" id="chat-view">
    <div class="nav-header">
        <span class="nav-back" onclick="switchView('list-view')">&lt;</span>
        <span class="nav-title" id="chatTitle"></span>
        <span onclick="openSet()">⚙️</span>
    </div>
    <div class="message-area" id="msgBox"></div>
    <div class="input-bar">
        <span onclick="document.getElementById('imgFile').click()">+</span>
        <input id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
        <span class="send-btn" onclick="sendMsg()">发送</span>
    </div>
</section>

<section class="view" id="moments-view">
    <div class="nav-header"><span class="nav-title">朋友圈</span></div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#ccc;overflow-y:auto;">暂无内容</div>
    <div class="tab-bar">
        <div class="tab-item" onclick="changeTab('chat')"><span class="tab-icon">💬</span><span>聊天</span></div>
        <div class="tab-item active" onclick="changeTab('moments')"><span class="tab-icon">🍥</span><span>朋友圈</span></div>
        <div class="tab-item" onclick="changeTab('me')"><span class="tab-icon">🫓</span><span>我</span></div>
    </div>
</section>

<section class="view" id="me-view">
    <div class="me-top">
        <img id="meAvatar" class="me-avatar" onclick="upAvatar()">
        <div>
            <div class="me-name" id="meName" onclick="editData('meName','修改昵称')">用户</div>
            <div class="me-code" id="meCode" onclick="editData('code','设置口袋码(最多10字符)')">口袋码：未设置</div>
        </div>
        <div class="me-qr" onclick="qrShow()">📷</div>
    </div>
    <div class="me-empty">功能暂未开放</div>
    <div class="tab-bar">
        <div class="tab-item" onclick="changeTab('chat')"><span class="tab-icon">💬</span><span>聊天</span></div>
        <div class="tab-item" onclick="changeTab('moments')"><span class="tab-icon">🍥</span><span>朋友圈</span></div>
        <div class="tab-item active" onclick="changeTab('me')"><span class="tab-icon">🫓</span><span>我</span></div>
    </div>
</section>

<section class="view" id="api-view" style="overflow-y:auto;">
    <div class="nav-header">
        <span class="nav-back" onclick="switchView('home-view')">&lt;</span>
        <span class="nav-title">API配置</span>
    </div>
    <div style="padding:20px;">
        <div style="margin:20px 0;">
            <p style="margin-bottom:8px;">API地址</p>
            <input id="apiUrl" placeholder="如: https://api.deepseek.com" style="width:100%;height:44px;border-radius:10px;border:1px solid #eee;padding:0 12px;">
        </div>
        <div style="margin:20px 0;">
            <p style="margin-bottom:8px;">API密钥</p>
            <input id="apiKey" type="password" style="width:100%;height:44px;border-radius:10px;border:1px solid #eee;padding:0 12px;">
        </div>
        <div style="margin:20px 0;">
            <p style="margin-bottom:8px;">API类型</p>
            <select id="apiType" style="width:100%;height:44px;border-radius:10px;border:1px solid #eee;padding:0 12px;">
                <option value="openai">OpenAI/Deepseek</option>
                <option value="gemini">Gemini</option>
            </select>
        </div>
        <div class="btn-group" style="margin-top:30px;">
            <button class="btn btn-save" onclick="saveApi()">保存</button>
            <button class="btn btn-cancel" onclick="testApi()">测试连通</button>
        </div>
    </div>
</section>

<div class="edit-mask" id="editMask">
    <div class="edit-box">
        <h4 id="editTit"></h4>
        <textarea id="editCon"></textarea>
        <div class="btn-group">
            <button class="btn btn-cancel" onclick="closeEdit()">取消</button>
            <button class="btn btn-save" onclick="saveEdit()">保存</button>
        </div>
    </div>
</div>

<div class="qr-mask" id="qrMask" onclick="qrHide()">
    <img src="">
</div>

<input type="file" id="avatarFile" accept="image/*">
<input type="file" id="imgFile" accept="image/*">
<input type="file" id="roleAvatarFile" accept="image/*">

<script>
// 强化代理策略
const CORS_PROXY = "https://api.allorigins.win/raw?url=";

let nowRoleId = null;
let editType = "";
let deletingRoleId = null;

let roleList = JSON.parse(localStorage.getItem("roleList")) || [{
    id:1,
    name:"手机小助手",
    avatar:"📱",
    prompt:"你是专属手机小助手，语气自然，不暴露AI",
    last:"快来聊天吧~",
    time:"",
    pushCount:0
}];

let chatData = JSON.parse(localStorage.getItem("chatData")) || {};
let userInfo = JSON.parse(localStorage.getItem("userInfo")) || {
    homeName:"用户",
    meName:"用户",
    avatar:"",
    code:"",
    location:"正在加载地点…"
};

let apiInfo = JSON.parse(localStorage.getItem("apiInfo")) || {
    url:"https://api.deepseek.com",
    key:"",
    type:"openai"
};

window.onload = function(){
    document.getElementById("homeName").innerText = userInfo.homeName;
    document.getElementById("meName").innerText = userInfo.meName;
    document.getElementById("locationTxt").innerText = userInfo.location;
    document.getElementById("homeAvatar").src = userInfo.avatar || "";
    document.getElementById("meAvatar").src = userInfo.avatar || "";
    document.getElementById("meCode").innerText = "口袋码："+(userInfo.code||"未设置");

    document.getElementById("apiUrl").value = apiInfo.url;
    document.getElementById("apiKey").value = apiInfo.key;
    document.getElementById("apiType").value = apiInfo.type;

    renderChatList();
    startTime();
    initLock();
    initRoleDelete();
}

function initLock(){
    let lock = document.getElementById("lock-screen");
    let startY = 0;
    lock.addEventListener("touchstart",e=>startY=e.touches[0].pageY);
    lock.addEventListener("touchend",e=>{
        let endY = e.changedTouches[0].pageY;
        if(startY - endY > 80) lock.classList.add("unlocked");
    });
}

function startTime(){
    setInterval(()=>{
        let d = new Date();
        let h = String(d.getHours()).padStart(2,"0");
        let m = String(d.getMinutes()).padStart(2,"0");
        let t = h + ":" + m;
        document.querySelector(".lock-clock").innerText = t;
        document.getElementById("nowTime").innerText = t;
    },1000);
}

function switchView(id){
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    if(id === "list-view") renderChatList();
}

function changeTab(tab){
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    if(tab === "chat") switchView("list-view");
    if(tab === "moments") document.getElementById("moments-view").classList.add("active");
    if(tab === "me") document.getElementById("me-view").classList.add("active");

    document.querySelectorAll(".tab-item").forEach(item=>item.classList.remove("active"));
    event.currentTarget.classList.add("active");
}

function renderChatList(){
    let html = "";
    roleList.forEach(item=>{
        let avatarShow = (item.avatar && item.avatar.length > 20) 
            ? `<img src="${item.avatar}">` 
            : item.avatar;

        html += `
        <div class="chat-item" data-id="${item.id}">
            <div class="c-avatar" onclick="event.stopPropagation();changeRoleAvatar(${item.id})">${avatarShow}</div>
            <div class="chat-info" onclick="openChat(${item.id})">
                <div class="chat-name">${item.name}</div>
                <div class="chat-desc">${item.last}</div>
            </div>
            <div class="chat-time">${item.time}</div>
        </div>
        `;
    });
    document.getElementById("chatList").innerHTML = html;
    saveData();
}

function initRoleDelete(){
    let pressTimer = null;
    document.getElementById("chatList").addEventListener("touchstart",e=>{
        let item = e.target.closest(".chat-item");
        if(!item) return;
        let rid = parseInt(item.dataset.id);
        if(rid === 1) return; 
        
        deletingRoleId = rid;
        pressTimer = setTimeout(()=>{
            if(confirm("确定删除该角色？")){
                roleList = roleList.filter(x=>x.id !== deletingRoleId);
                delete chatData[deletingRoleId];
                renderChatList();
            }
        }, 3000);
    });
    document.getElementById("chatList").addEventListener("touchend",()=>{
        clearTimeout(pressTimer);
        deletingRoleId = null;
    });
}

function changeRoleAvatar(roleId){
    if(roleId === 1) return alert("系统内置头像不可更改");
    nowRoleId = roleId;
    document.getElementById("roleAvatarFile").click();
}

document.getElementById("roleAvatarFile").onchange = function(e){
    let file = e.target.files[0];
    if(!file)return;
    let reader = new FileReader();
    reader.onload = function(ev){
        let idx = roleList.findIndex(x=>x.id === nowRoleId);
        roleList[idx].avatar = ev.target.result;
        renderChatList();
    }
    reader.readAsDataURL(file);
    this.value = "";
}

function openChat(id){
    nowRoleId = id;
    let obj = roleList.find(x=>x.id === id);
    document.getElementById("chatTitle").innerText = obj.name;
    renderChatMsg();
    switchView("chat-view");
}

function renderChatMsg(){
    let box = document.getElementById("msgBox");
    let logs = chatData[nowRoleId] || [];
    let html = "";
    logs.forEach((v, index)=>{
        html += `<div class="bubble ${v.type==='user'?'bubble-user':'bubble-ai'}" 
                 ondblclick="deleteSingleMsg(${index})">${v.content}</div>`;
    })
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
}

function deleteSingleMsg(index) {
    if(confirm("确定要删除这条消息吗？")){
        chatData[nowRoleId].splice(index, 1);
        saveData();
        renderChatMsg();
    }
}

async function sendMsg(){
    let val = document.getElementById("chatInput").value.trim();
    if(!val) return;
    document.getElementById("chatInput").value = "";

    if(!chatData[nowRoleId]) chatData[nowRoleId] = [];
    chatData[nowRoleId].push({type:"user",content:val});

    let now = new Date();
    let t = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    let idx = roleList.findIndex(x=>x.id === nowRoleId);
    roleList[idx].last = val;
    roleList[idx].time = t;

    saveData();
    renderChatMsg();

    document.getElementById("chatTitle").innerText = "对方正在回复…";
    await getMultiReply(6);
    document.getElementById("chatTitle").innerText = roleList[idx].name;
}

async function getMultiReply(maxNum){
    let obj = roleList.find(x=>x.id === nowRoleId);
    let history = (chatData[nowRoleId] || []).slice(-8);
    let res = await requestAi(history, obj.prompt);
    if(!res) return;

    let arr = res.split(/[\n\n]+/).filter(x=>x.trim());
    let limit = arr.slice(0, maxNum);
    for(let item of limit){
        chatData[nowRoleId].push({type:"ai",content:item});
        saveData();
        renderChatMsg();
        await sleep(600);
    }
}

async function requestAi(history,prompt){
    if(!apiInfo.url || !apiInfo.key) return "❌ 请先配置 API 地址和密钥";
    return apiInfo.type === "gemini" ? await requestGemini(history,prompt) : await requestOpenAI(history,prompt);
}

// 已更新：OpenAI 请求逻辑（带诊断）
async function requestOpenAI(history,prompt){
    let msg = [{role:"system",content:prompt}];
    history.forEach(v=>{
        msg.push({role: v.type==="user"?"user":"assistant", content: v.content})
    });

    try{
        let baseUrl = apiInfo.url.trim().replace(/\/+$/, "");
        let target = baseUrl.includes("/v1") ? baseUrl : `${baseUrl}/v1/chat/completions`;
        
        let res = await fetch(CORS_PROXY + encodeURIComponent(target),{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + apiInfo.key.trim()
            },
            body:JSON.stringify({
                model: apiInfo.url.includes("deepseek") ? "deepseek-chat" : "gpt-3.5-turbo",
                messages:msg,
                temperature:0.8
            })
        });

        if(!res.ok) {
            const errText = await res.text();
            throw new Error(`HTTP ${res.status}: ${errText.substring(0,30)}`);
        }

        let data = await res.json();
        return data.choices[0].message.content;
    }catch(e){
        console.error("OpenAI Error:", e);
        return `❌ 连接失败: ${e.message}`;
    }
}

// 已更新：Gemini 请求逻辑（带诊断）
async function requestGemini(history,prompt){
    try {
        let url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiInfo.key.trim()}`;
        let contents = [];
        if(prompt) contents.push({role:"user",parts:[{text: "这是你的背景设定，请严格遵守："+prompt}]});
        
        history.forEach(v=>{
            contents.push({
                role: v.type==="user"?"user":"model",
                parts:[{text:v.content}]
            })
        });

        let res = await fetch(CORS_PROXY + encodeURIComponent(url),{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({contents})
        });

        if(!res.ok) {
            const errText = await res.text();
            throw new Error(`HTTP ${res.status}: ${errText.substring(0,30)}`);
        }

        let data = await res.json();
        return data.candidates[0].content.parts[0].text;
    } catch(e) {
        console.error("Gemini Error:", e);
        return `❌ 连接失败: ${e.message}`;
    }
}

function addRole(){
    let name = prompt("请输入角色名称");
    if(!name) return;
    let newId = Date.now();
    roleList.push({
        id:newId,
        name:name,
        avatar:"🤖",
        prompt:"",
        last:"暂无对话",
        time:"",
        pushCount:0
    })
    saveData();
    renderChatList();
}

function openSet(){
    let o = roleList.find(x=>x.id === nowRoleId);
    editType = "prompt";
    document.getElementById("editCon").value = o.prompt;
    document.getElementById("editTit").innerText = "编辑角色人设";
    document.getElementById("editMask").style.display = "block";
}

function editData(type,tit){
    editType = type;
    document.getElementById("editTit").innerText = tit;
    if(type=="homeName") document.getElementById("editCon").value = userInfo.homeName;
    if(type=="meName") document.getElementById("editCon").value = userInfo.meName;
    if(type=="code") document.getElementById("editCon").value = userInfo.code;
    if(type=="location") document.getElementById("editCon").value = userInfo.location;
    document.getElementById("editMask").style.display = "block";
}

function closeEdit(){
    document.getElementById("editMask").style.display = "none";
}

function saveEdit(){
    let val = document.getElementById("editCon").value;
    if(editType === "prompt"){
        let idx = roleList.findIndex(x=>x.id === nowRoleId);
        roleList[idx].prompt = val;
    }
    if(editType=="homeName") userInfo.homeName = val;
    if(editType=="meName") userInfo.meName = val;
    if(editType=="code") userInfo.code = val.slice(0,10);
    if(editType=="location") userInfo.location = val;

    saveData();
    closeEdit();
    renderChatList();
    document.getElementById("homeName").innerText = userInfo.homeName;
    document.getElementById("meName").innerText = userInfo.meName;
    document.getElementById("locationTxt").innerText = userInfo.location;
}

document.getElementById("avatarFile").onchange = function(e){
    let file = e.target.files[0];
    let reader = new FileReader();
    reader.onload = function(ev){
        userInfo.avatar = ev.target.result;
        document.getElementById("homeAvatar").src = ev.target.result;
        document.getElementById("meAvatar").src = ev.target.result;
        saveData();
    }
    reader.readAsDataURL(file);
    this.value = "";
}
function upAvatar(){
    document.getElementById("avatarFile").click();
}

function saveApi(){
    apiInfo.url = document.getElementById("apiUrl").value.trim();
    apiInfo.key = document.getElementById("apiKey").value.trim();
    apiInfo.type = document.getElementById("apiType").value;
    localStorage.setItem("apiInfo",JSON.stringify(apiInfo));
    alert("已保存API配置");
}

async function testApi(){
    saveApi();
    alert("正在测试连通性，请稍候...");
    let res = await requestAi([{type:"user", content:"你好"}], "你是一个测试助手");
    if(res && !res.includes("❌")) {
        alert("连通成功！AI回复：" + res.substring(0, 20) + "...");
    } else {
        alert("连通失败。原因：" + res + "\n\n请检查：\n1. API Key/地址是否正确\n2. 代理是否可用\n3. 余额是否充足");
    }
}

function saveData(){
    localStorage.setItem("roleList",JSON.stringify(roleList));
    localStorage.setItem("chatData",JSON.stringify(chatData));
    localStorage.setItem("userInfo",JSON.stringify(userInfo));
    localStorage.setItem("apiInfo",JSON.stringify(apiInfo));
}

function sleep(t){
    return new Promise(res=>setTimeout(res,t));
}

function qrHide() {
    document.getElementById("qrMask").classList.remove("show");
}
function qrShow() {
    document.getElementById("qrMask").classList.add("show");
    document.querySelector("#qrMask img").src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + (userInfo.code || "PocketUser");
}
</script>
